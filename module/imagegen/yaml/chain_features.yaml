krea2_style_reference:
  chains: krea2_style_reference
  display_name: "KREA2 Style Reference"
  description: "(Krea-2-Turbo recommended) Add style reference images to perform style reference editing."
  max_count: 3
  usage_guideline: "Supply style reference image as Base64 Data URI or HTTP/HTTPS URL."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Style reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
    required:
      - image
joyai_reference_edit:
  chains: joyai_image
  display_name: "JoyAI Reference Edit"
  description: " (JoyAI-Image-Edit recommended) For multimodal models, this feature enables powerful editing and combining capabilities. In txt2img mode, adding a single reference image performs an Image Edit (JoyAI-Image-Edit recommended), while adding multiple images performs an Image Combine (JoyAI-Image-Edit-Plus recommended with ZeroGPU Duration (s) set to 120)."
  max_count: 2
  usage_guideline: "Supply JoyAI reference image as Base64 Data URI or HTTP/HTTPS URL."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Input reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
    required:
      - image

qwen_image_edit:
  chains: qwen_image_edit
  display_name: "Qwen-Image Edit"
  description: " (lightx2v/Qwen-Image-Edit-2511-Lightning recommended) In txt2img mode, adding a single reference image performs an Image Edit, while adding multiple images performs an Image Combine."
  max_count: 3
  usage_guideline: "Supply reference image(s) (up to 3) encoded as Base64 Data URI or HTTP/HTTPS URL. Passing a single reference image performs an Image Edit, while passing multiple images performs an Image Combine."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
    required:
      - image


hidream_o1_smoothing:
  chains: hidream_o1_smoothing
  display_name: "HiDream O1 Smoothing Injector"
  description: "HiDream O1 detail smoothing and artifact reduction injector."
  max_count: 1
  usage_guideline: "Configures smoothing factor for HiDream models."
  parameters_schema:
    type: object
    properties:
      factor:
        type: number
        default: 0.5
        description: "Smoothing intensity (0.0 to 1.0)."
    required: []
hidream_o1_reference:
  chains: hidream_o1_reference
  display_name: "HiDream-O1 Reference Edit"
  description: " (HiDream-O1-Image-Dev recommended with resolution set to 4.0MP, e.g., 2048x2048) For HiDream-O1 models, this feature enables reference image editing and combining capabilities. In txt2img mode, adding a single reference image performs an Image Edit, while adding multiple images performs an Image Combine."
  max_count: 9
  usage_guideline: "Supply reference image(s) (up to 9) encoded as Base64 Data URI or HTTP/HTTPS URL. Passing a single reference image performs an Image Edit, while passing multiple images performs an Image Combine."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
    required:
      - image

sensenova_reference:
  chains: sensenova_reference
  display_name: "SenseNova Reference Edit"
  description: "For SenseNova models, this feature enables reference image editing and combining capabilities. In txt2img mode, adding a single reference image performs an Image Edit, while adding multiple images performs an Image Combine."
  max_count: 10
  usage_guideline: "Supply reference image(s) (up to 10) encoded as Base64 Data URI or HTTP/HTTPS URL. Passing a single reference image performs an Image Edit, while passing multiple images performs an Image Combine."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
    required:
      - image

flux1_ipadapter:
  chains: flux1_ipadapter
  display_name: "Flux1 IP-Adapter"
  description: "FLUX.1 model-specific IP-Adapter implementation."
  max_count: 5
  usage_guideline: "Supply reference image (Base64 Data URI or HTTP/HTTPS URL), optional weight (default 1.0), start_at (default 0.0), and end_at (default 1.0). Up to 5 images supported."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
      weight:
        type: number
        default: 1.0
        description: "Influence weight of the image prompt (0.0 to 2.0)."
      start_at:
        type: number
        default: 0.0
        description: "Start step percentage for IP-Adapter application (0.0 to 1.0)."
      end_at:
        type: number
        default: 1.0
        description: "End step percentage for IP-Adapter application (0.0 to 1.0)."
      start_percent:
        type: number
        default: 0.0
        description: "Alias for start_at."
      end_percent:
        type: number
        default: 1.0
        description: "Alias for end_at."
    required:
      - image

sd3_ipadapter:
  chains: sd3_ipadapter
  display_name: "SD3 IP-Adapter"
  description: "SD3/SD3.5 model-specific IP-Adapter implementation."
  max_count: 5
  usage_guideline: "Supply reference image (Base64 Data URI or HTTP/HTTPS URL), optional weight (default 1.0), start_at (default 0.0), and end_at (default 1.0). Up to 5 images supported."
  parameters_schema:
    type: object
    properties:
      image:
        type: string
        description: "Reference image encoded as Base64 Data URI or HTTP/HTTPS URL."
      weight:
        type: number
        default: 1.0
        description: "Influence weight of the image prompt (0.0 to 2.0)."
      start_at:
        type: number
        default: 0.0
        description: "Start step percentage for IP-Adapter application (0.0 to 1.0)."
      end_at:
        type: number
        default: 1.0
        description: "End step percentage for IP-Adapter application (0.0 to 1.0)."
      start_percent:
        type: number
        default: 0.0
        description: "Alias for start_at."
      end_percent:
        type: number
        default: 1.0
        description: "Alias for end_at."
    required:
      - image

embedding:
  chains: embedding
  display_name: "Textual Inversion Embedding Injector"
  description: "Downloads Textual Inversion embedding files from Civitai, Hugging Face, or uploads to the server. Note: This feature ONLY handles file downloading/preparation. To activate the embedding, manually add 'embedding:<filename>' (e.g. 'embedding:civitai/456' for Civitai ID 456, 'embedding:huggingface/lazypos' for Hugging Face, or 'embedding:upload_file/filename' for uploaded files) into your prompt or negative_prompt."
  max_count: 5
  usage_guideline: "Specify source ('Civitai', 'Hugging Face', or 'Upload File'), and embedding_value (Civitai Version ID, HF repo file path, or uploaded filename). The file is stored on server; manually enter 'embedding:<filename>' in prompt or negative_prompt to activate."
  parameters_schema:
    type: object
    properties:
      source:
        type: string
        enum:
          - "Civitai"
          - "Hugging Face"
          - "Upload File"
        description: "Download source for the Textual Inversion embedding file. Use 'Civitai' to download by Version ID, 'Hugging Face' to download by repo file path, or 'Upload File' for uploaded files."
      embedding_value:
        type: string
        description: "For Civitai: the Version ID (e.g., '456' from civitai.com/models/123?modelVersionId=456, saved as 'civitai/456.safetensors'). For Hugging Face: repo_id/filename.extension (e.g., 'ilikebigturtles/lazypos/lazypos.safetensors', saved as 'huggingface/lazypos.safetensors'). For Upload File: uploaded filename (saved as 'upload_file/filename.safetensors'). Manually reference embedding:<filename> in prompt or negative_prompt."
    required:
      - source
      - embedding_value

qwen_image_2_1_prompt_enhancer:
  chains: qwen_image_2_1_prompt_enhancer
  display_name: "Qwen-Image-2.1 Prompt Enhancer Settings"
  description: "Enhance prompts using Qwen-Image-2.1 Prompt Enhancer with automatic model selection (T2I vs I2I/reference images) and optional reasoning CoT thinking mode."
  max_count: 1
  usage_guideline: "Set enable to true to activate prompt enhancement. Enable thinking to allow reasoning CoT (reasoning tags are automatically stripped from the resulting prompt). Set max_length to control generation length."
  parameters_schema:
    type: object
    properties:
      enable:
        type: boolean
        default: false
        description: "Enable Qwen-Image-2.1 Prompt Enhancer."
      thinking:
        type: boolean
        default: false
        description: "Enable thinking (reasoning CoT). Thought text inside <think> tags will be automatically stripped before passing prompt to downstream text encoding."
      max_length:
        type: integer
        default: 4096
        description: "Maximum generation length for prompt enhancement (default 4096)."

ming_image_prompt_enhancer:
  chains: ming_image_prompt_enhancer
  display_name: "Ming-Image Prompt Enhancer Settings"
  description: "Enhance prompts using Ming-Image Prompt Enhancer (Qwen3.8-27B) guided by official Figma-style rewriter System Prompt, with optional reasoning CoT thinking mode."
  max_count: 1
  usage_guideline: "Set enable to true to activate Ming-Image prompt enhancement. Supports single/multi-reference images, thinking mode, and custom system prompt."
  parameters_schema:
    type: object
    properties:
      enable:
        type: boolean
        default: false
        description: "Enable Ming-Image Prompt Enhancer."
      thinking:
        type: boolean
        default: false
        description: "Enable thinking (reasoning CoT)."
      max_length:
        type: integer
        default: 4096
        description: "Maximum generation length for prompt enhancement (default 4096)."
      system_prompt:
        type: string
        description: "System prompt for Qwen3.8-27B prompt enhancer (defaults to official Ming-Image Figma-style rewriter prompt)."

flux3_prompt_upsampler:
  chains: flux3_prompt_upsampler
  display_name: "FLUX.3 Prompt Upsampler Settings"
  description: "Expand short prompts into detailed generative captions using FLUX.3 Prompt Upsampler (qwen3.5_9b_flux3_prompt_upsampler_w4a8) with automatic official template selection (t2i, i2i, t2i_bbox, i2i_bbox), multi-reference image stitching, and reasoning CoT thinking mode."
  max_count: 1
  usage_guideline: "Set enable to true to activate FLUX.3 prompt upsampler. Automatically selects official BFL t2i or i2i template based on input image detection. Supports bbox_mode, thinking mode, and multi-reference image stitching."
  parameters_schema:
    type: object
    properties:
      enable:
        type: boolean
        default: false
        description: "Enable FLUX.3 Prompt Upsampler."
      thinking:
        type: boolean
        default: false
        description: "Enable thinking (reasoning CoT)."
      bbox_mode:
        type: boolean
        default: false
        description: "Enable BBox mode (automatically selects t2i_bbox or i2i_bbox official system prompt templates to output bounding boxes)."
      max_length:
        type: integer
        default: 3584
        description: "Maximum generation length for prompt upsampler (default 3584)."
      system_prompt:
        type: string
        description: "Optional custom system prompt override (defaults to official t2i/i2i or t2i_bbox/i2i_bbox templates)."

moss_image_control:
  chains: moss_image_control
  display_name: "MOSS-Image Color/Depth Control"
  description: "Controls MOSS-Image generation using a color region map (object/region spatial layout) and/or a depth map (3D spatial depth, near is white) via darask0/MOSS-Image-color-depth-control adapter and MOSSImageControl node."
  max_count: 1
  usage_guideline: "Supply color_map (RGB region ID map) and/or depth_map (near=white grayscale map) as Base64 Data URI or HTTP/HTTPS URL. Set strength (default 1.0) and timestep range (start_percent 0.0, end_percent 0.5)."
  parameters_schema:
    type: object
    properties:
      color_map:
        type: string
        description: "Color region map image encoded as Base64 Data URI or HTTP/HTTPS URL. Each region uses a flat RGB color as a region ID."
      depth_map:
        type: string
        description: "Depth map image encoded as Base64 Data URI or HTTP/HTTPS URL (near is white, far is dark)."
      strength:
        type: number
        default: 1.0
        minimum: 0.0
        maximum: 2.0
        description: "Control influence strength multiplier (default 1.0)."
      start_percent:
        type: number
        default: 0.0
        minimum: 0.0
        maximum: 1.0
        description: "Sampling percentage at which control begins (default 0.0)."
      end_percent:
        type: number
        default: 0.5
        minimum: 0.0
        maximum: 1.0
        description: "Sampling percentage at which control ends (default 0.5, use 0.5 for 3D mannequin)."

moss_image_edit:
  chains: moss_image_edit
  display_name: "MOSS-Image Edit"
  description: "Edits images or generates variants using MOSS-Image Edit LoRA (officially packaged by Comfy-Org as moss_image_edit_lora_rank_64_bf16.safetensors) and native TextEncodeMOSSImageEdit node."
  max_count: 10
  usage_guideline: "Upload 1-10 reference images and specify prompt. Automatically uses the official MOSS-Image Edit LoRA layout."
  parameters_schema:
    type: object
    properties:
      images:
        type: array
        items:
          type: string
        description: "List of 1 to 10 reference images encoded as Base64 Data URI, HTTP/HTTPS URL, or local file path."



