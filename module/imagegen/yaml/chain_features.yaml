embedding:
  chains: embedding
  display_name: "Textual Inversion Embedding Injector"
  description: "Downloads Textual Inversion embedding files from Civitai, Hugging Face, or uploads to the server. Note: This feature ONLY handles file downloading/preparation. To activate the embedding, manually add 'embedding:<filename>' (e.g. 'embedding:civitai/456' for Civitai ID 456, 'embedding:huggingface/lazypos' for Hugging Face, or 'embedding:upload_file/filename' for uploaded files) into your prompt or negative_prompt."
  max_count: 5
  usage_guideline: "Specify source ('Civitai', 'Hugging Face', or 'Upload File'), and embedding_value (Civitai Version ID, HF repo file path, or uploaded filename). The file is stored on server; manually enter 'embedding:<filename>' in prompt or negative_prompt to activate."
  parameters_schema:
    type: object
    properties:
      source:
        type: string
        enum:
          - "Civitai"
          - "Hugging Face"
          - "Upload File"
        description: "Download source for the Textual Inversion embedding file. Use 'Civitai' to download by Version ID, 'Hugging Face' to download by repo file path, or 'Upload File' for uploaded files."
      embedding_value:
        type: string
        description: "For Civitai: the Version ID (e.g., '456' from civitai.com/models/123?modelVersionId=456, saved as 'civitai/456.safetensors'). For Hugging Face: repo_id/filename.extension (e.g., 'ilikebigturtles/lazypos/lazypos.safetensors', saved as 'huggingface/lazypos.safetensors'). For Upload File: uploaded filename (saved as 'upload_file/filename.safetensors'). Manually reference embedding:<filename> in prompt or negative_prompt."
    required:
      - source
      - embedding_value

prompt_enhancer:
  chains: prompt_enhancer
  display_name: "Prompt Enhancer Settings"
  description: "Enhance or upsample prompts with any registered prompt-enhancer model (Qwen-Image-2.1 PE T2I/I2I, Qwen3.8-27B, Qwen3.5-9B, Qwen3-VL-4B-Instruct, FLUX.3 Prompt Upsampler, P-H3-Image Prompt Upsampler), optional reasoning CoT thinking mode, and optional system prompt. The clip and system_prompt registries are independent, so they are freely mixable across architectures."
  max_count: 1
  usage_guideline: "Set enable to true to activate prompt enhancement. Pick model from the clip registry and system_prompt from the system_prompt registry in yaml/prompt_enhancer.yaml; both lists are global, so any architecture may select any clip paired with any system prompt. Defaults for each framework come from the architecture section and reset when the base model changes. architecture[framework].clip_type is the framework's own encoder and applies to whatever clip is selected, so a prompt upsampler built for one vendor still runs under another framework's encoder. Nothing is auto-detected from images, so an explicit system prompt always wins. Enable thinking for reasoning CoT (reasoning tags are stripped from the result), and set max_length for generation length."
  parameters_schema:
    type: object
    properties:
      enable:
        type: boolean
        default: false
        description: "Enable prompt enhancement."
      thinking:
        type: boolean
        default: false
        description: "Enable thinking (reasoning CoT). Thought text inside <think> tags is automatically stripped before the prompt reaches downstream text encoding."
      model:
        type: string
        description: "Prompt Enhancer Model name from the clip registry in yaml/prompt_enhancer.yaml (e.g. Qwen-Image-2.1-Prompt-Enhancer-T2I, Qwen/Qwen3.8-27B, Qwen/Qwen3.5-9B, Qwen/Qwen3-VL-4B-Instruct, black-forest-labs/Qwen3.5-9B-FLUX.3-Prompt-Upsampler, PrunaAI/P-H3-Image-Prompt-Upsampler). Any model may select any registered clip regardless of architecture. The CLIPLoader type is the framework's, not the checkpoint's: architecture[framework].clip_type applies to whatever clip is selected (same Qwen3.5-9B weights load as `minimax` for MiniMax-H3-Image and `moss_image` for MOSS-Image), so a Qwen-Image-2.1 upsampler still runs as `moss_image` under MOSS-Image. A clip entry may also declare its own clip_type for calls without framework context. Defaults to the architecture entry for the active framework."
      system_prompt:
        type: string
        description: "System Prompt name from the system_prompt registry in yaml/prompt_enhancer.yaml (e.g. none, Ming-Image-PE-Template, FLUX.3-T2I-PE-Template, FLUX.3-I2I-PE-Template, FLUX.3-T2I-Bbox-PE-Template, FLUX.3-I2I-Bbox-PE-Template). Independent of the selected clip and never inferred from images; an empty prompt means no system prompt."
      max_length:
        type: integer
        default: 4096
        description: "Maximum generation length for prompt enhancement (default 4096)."

moss_image_control:
  chains: moss_image_control
  display_name: "MOSS-Image Color/Depth Control"
  description: "Controls MOSS-Image generation using a color region map (object/region spatial layout) and/or a depth map (3D spatial depth, near is white) via darask0/MOSS-Image-color-depth-control adapter and MOSSImageControl node."
  max_count: 1
  usage_guideline: "Supply color_map (RGB region ID map) and/or depth_map (near=white grayscale map) as Base64 Data URI or HTTP/HTTPS URL. Set strength (default 1.0) and timestep range (start_percent 0.0, end_percent 0.5)."
  parameters_schema:
    type: object
    properties:
      color_map:
        type: string
        description: "Color region map image encoded as Base64 Data URI or HTTP/HTTPS URL. Each region uses a flat RGB color as a region ID."
      depth_map:
        type: string
        description: "Depth map image encoded as Base64 Data URI or HTTP/HTTPS URL (near is white, far is dark)."
      strength:
        type: number
        default: 1.0
        minimum: 0.0
        maximum: 2.0
        description: "Control influence strength multiplier (default 1.0)."
      start_percent:
        type: number
        default: 0.0
        minimum: 0.0
        maximum: 1.0
        description: "Sampling percentage at which control begins (default 0.0)."
      end_percent:
        type: number
        default: 0.5
        minimum: 0.0
        maximum: 1.0
        description: "Sampling percentage at which control ends (default 0.5, use 0.5 for 3D mannequin)."

moss_image_edit:
  chains: moss_image_edit
  display_name: "MOSS-Image Edit"
  description: "Edits images or generates variants using MOSS-Image Edit LoRA (officially packaged by Comfy-Org as moss_image_edit_lora_rank_64_bf16.safetensors) and native TextEncodeMOSSImageEdit node."
  max_count: 10
  usage_guideline: "Upload 1-10 reference images and specify prompt. Automatically uses the official MOSS-Image Edit LoRA layout."
  parameters_schema:
    type: object
    properties:
      images:
        type: array
        items:
          type: string
        description: "List of 1 to 10 reference images encoded as Base64 Data URI, HTTP/HTTPS URL, or local file path."



