nodes:
  pos_prompt:
    class_type: CLIPTextEncode
    title: "moss-image Positive"
  neg_prompt:
    class_type: CLIPTextEncode
    title: "moss-image Negative"
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      weight_dtype: "default"
  slg:
    class_type: SkipLayerGuidanceDiTSimple
    title: "SkipLayerGuidanceDiTSimple"
    params:
      double_layers: ""
      single_layers: "22"
      start_percent: 0.0
      end_percent: 0.5
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      type: "moss_image"
      device: "default"
  vae_loader:
    class_type: VAELoader
    title: "Load VAE"

connections:
  - from: "unet_loader:0"
    to: "slg:model"
  - from: "slg:0"
    to: "ksampler:model"
  - from: "clip_loader:0"
    to: "pos_prompt:clip"
  - from: "clip_loader:0"
    to: "neg_prompt:clip"
  - from: "pos_prompt:0"
    to: "ksampler:positive"
  - from: "neg_prompt:0"
    to: "ksampler:negative"
  - from: "vae_loader:0"
    to: "vae_decode:vae"
  - from: "vae_loader:0"
    to: "vae_encode:vae"

dynamic_lora_chains:
  lora_chain:
    template: "LoraLoader"
    output_map:
      "unet_loader:0": "model"
      "clip_loader:0": "clip"
    input_map:
      "model": "model"
      "clip": "clip"
    end_input_map:
      "model": ["slg:model"]
      "clip": ["pos_prompt:clip", "neg_prompt:clip"]

dynamic_conditioning_chains:
  conditioning_chain:
    ksampler_node: "ksampler"
    clip_source: "clip_loader:0"

dynamic_vae_chains:
  vae_chain:
    targets:
      - "vae_decode:vae"
      - "vae_encode:vae"

dynamic_pid_chains:
  pid_chain:
    ksampler_node: "ksampler"

dynamic_moss_image_control_chains:
  moss_image_control_chain:
    ksampler_node: "ksampler"
    pos_prompt_node: "pos_prompt"
    neg_prompt_node: "neg_prompt"
    vae_loader_node: "vae_loader"

ui_map:
  positive_prompt: "pos_prompt:text"
  negative_prompt: "neg_prompt:text"
  unet_name: "unet_loader:unet_name"
  clip_name: "clip_loader:clip_name"
  vae_name: "vae_loader:vae_name"
