nodes:
  boogu_prompt:
    class_type: TextEncodeBooguEdit
    title: "Text Encode Boogu Edit"
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      weight_dtype: "default"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      type: "boogu"
      device: "default"
  vae_loader:
    class_type: VAELoader
    title: "Load VAE"

connections:
  - from: "unet_loader:0"
    to: "ksampler:model"
  - from: "clip_loader:0"
    to: "boogu_prompt:clip"
  - from: "boogu_prompt:0"
    to: "ksampler:positive"
  - from: "boogu_prompt:1"
    to: "ksampler:negative"
  - from: "vae_loader:0"
    to: "vae_decode:vae"
  - from: "vae_loader:0"
    to: "vae_encode:vae"

dynamic_lora_chains:
  lora_chain:
    template: "LoraLoader"
    output_map:
      "unet_loader:0": "model"
      "clip_loader:0": "clip"
    input_map:
      "model": "model"
      "clip": "clip"
    end_input_map:
      "model": ["ksampler:model"]
      "clip": ["boogu_prompt:clip"]

dynamic_conditioning_chains:
  conditioning_chain:
    ksampler_node: "ksampler"
    clip_source: "clip_loader:0"

dynamic_boogu_image_edit_chains:
  boogu_image_edit_chain:
    ksampler_node: "ksampler"
    boogu_prompt_node: "boogu_prompt"
    vae_loader_node: "vae_loader"

dynamic_pid_chains:
  pid_chain:
    ksampler_node: "ksampler"

ui_map:
  positive_prompt: "boogu_prompt:prompt"
  negative_prompt: "boogu_prompt:negative_prompt"
  unet_name: "unet_loader:unet_name"
  clip_name: "clip_loader:clip_name"
  vae_name: "vae_loader:vae_name"
