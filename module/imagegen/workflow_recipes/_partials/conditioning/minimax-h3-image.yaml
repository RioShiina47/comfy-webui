nodes:
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      weight_dtype: "default"
  vae_loader:
    class_type: VAELoader
    title: "Load VAE"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      type: "minimax"
      device: "default"
  prompt:
    class_type: MiniMaxH3ImageConditioning
    title: "MiniMax H3 Image Conditioning"
    params:
      width: 2048
      height: 2048
  negative_zero_out:
    class_type: ConditioningZeroOut
    title: "Conditioning Zero Out (Negative)"

connections:
  - from: "unet_loader:0"
    to: "ksampler:model"
  - from: "clip_loader:0"
    to: "prompt:clip"
  - from: "vae_loader:0"
    to: "prompt:vae"
  - from: "prompt:0"
    to: "ksampler:positive"
  - from: "prompt:0"
    to: "negative_zero_out:conditioning"
  - from: "negative_zero_out:0"
    to: "ksampler:negative"
  - from: "prompt:1"
    to: "ksampler:latent_image"
  - from: "vae_loader:0"
    to: "vae_decode:vae"
  - from: "vae_loader:0"
    to: "vae_encode:vae"

dynamic_lora_chains:
  lora_chain:
    template: "LoraLoader"
    output_map:
      "unet_loader:0": "model"
      "clip_loader:0": "clip"
    input_map:
      "model": "model"
      "clip": "clip"
    end_input_map:
      "model": ["ksampler:model"]
      "clip": ["prompt:clip"]

dynamic_reference_image_chains:
  reference_image_chain:
    text_encode_node: "prompt"
    vae_node: "vae_loader"
    max_images: 8

ui_map:
  positive_prompt: "prompt:prompt"
  negative_prompt: "dummy:negative_prompt"
  unet_name: "unet_loader:unet_name"
  clip_name: "clip_loader:clip_name"
  vae_name: "vae_loader:vae_name"
  width: "prompt:width"
  height: "prompt:height"
