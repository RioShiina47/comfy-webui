nodes:
  prompt:
    class_type: TextEncodeQwenImage21
    title: "Text Encode Qwen Image 2.1"
    params:
      resolution: 1024
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      weight_dtype: "default"
  vae_loader:
    class_type: VAELoader
    title: "Load VAE"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      type: "qwen_image"
      device: "default"

connections:
  - from: "unet_loader:0"
    to: "ksampler:model"

  - from: "clip_loader:0"
    to: "prompt:clip"

  - from: "vae_loader:0"
    to: "vae_decode:vae"
  - from: "vae_loader:0"
    to: "vae_encode:vae"

  - from: "prompt:0"
    to: "ksampler:positive"
  - from: "prompt:1"
    to: "ksampler:negative"

dynamic_lora_chains:
  lora_chain:
    template: "LoraLoader"
    output_map:
      "unet_loader:0": "model"
      "clip_loader:0": "clip"
    input_map:
      "model": "model"
      "clip": "clip"
    end_input_map:
      "model": ["ksampler:model"]
      "clip": ["prompt:clip"]

dynamic_controlnet_chains:
  controlnet_chain:
    template: "ControlNetApplyAdvanced"
    ksampler_node: "ksampler"
    vae_source: "vae_loader:0"

dynamic_conditioning_chains:
  conditioning_chain:
    ksampler_node: "ksampler"
    clip_source: "clip_loader:0"

dynamic_pid_chains:
  pid_chain:
    ksampler_node: "ksampler"

dynamic_reference_image_chains:
  reference_image_chain:
    text_encode_node: "prompt"
    vae_node: "vae_loader"
    max_images: 10

ui_map:
  positive_prompt: "prompt:prompt"
  negative_prompt: "prompt:negative_prompt"
  unet_name: "unet_loader:unet_name"
  vae_name: "vae_loader:vae_name"
  clip_name: "clip_loader:clip_name"
  scheduler_width: "prompt:resolution"
