nodes:
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      weight_dtype: "default"
  vae_loader:
    class_type: VAELoader
    title: "Load VAE"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      type: "joyimage"
      device: "default"

  pos_prompt:
    class_type: TextEncodeJoyImageEdit
    title: "TextEncodeJoyImageEdit (Positive)"
  neg_prompt:
    class_type: TextEncodeJoyImageEdit
    title: "TextEncodeJoyImageEdit (Negative)"

  cfg_norm:
    class_type: CFGNorm
    title: "CFGNorm"
    params:
      strength: 1.0
      pre_cfg: true

connections:
  - from: "unet_loader:0"
    to: "cfg_norm:model"
  - from: "cfg_norm:0"
    to: "ksampler:model"

  - from: "clip_loader:0"
    to: "pos_prompt:clip"
  - from: "clip_loader:0"
    to: "neg_prompt:clip"

  - from: "pos_prompt:0"
    to: "ksampler:positive"
  - from: "neg_prompt:0"
    to: "ksampler:negative"

  - from: "vae_loader:0"
    to: "vae_decode:vae"
  - from: "vae_loader:0"
    to: "vae_encode:vae"

dynamic_lora_chains:
  lora_chain:
    template: "LoraLoader"
    output_map:
      "unet_loader:0": "model"
      "clip_loader:0": "clip"
    input_map:
      "model": "model"
      "clip": "clip"
    end_input_map:
      "model": ["cfg_norm:model"]
      "clip": ["pos_prompt:clip", "neg_prompt:clip"]

dynamic_conditioning_chains:
  conditioning_chain:
    ksampler_node: "ksampler"
    clip_source: "clip_loader:0"

dynamic_pid_chains:
  pid_chain:
    ksampler_node: "ksampler"

ui_map:
  unet_name: "unet_loader:unet_name"
  vae_name: "vae_loader:vae_name"
  clip_name: "clip_loader:clip_name"
  positive_prompt: "pos_prompt:prompt"
  negative_prompt: "neg_prompt:prompt"

