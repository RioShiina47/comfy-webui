nodes:
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      unet_name: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
      weight_dtype: "default"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      clip_name: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
      type: "minimax"
      device: "default"
  video_vae_loader:
    class_type: VAELoader
    title: "Load Video VAE"
    params:
      vae_name: "minimax_h3_video_vae_fp16.safetensors"
  audio_vae_loader:
    class_type: VAELoader
    title: "Load Audio VAE"
    params:
      vae_name: "minimax_h3_audio_vae_fp32.safetensors"
  minimax_h3:
    class_type: MiniMaxH3ReferenceToVideo
    title: "MiniMax H3 Reference to Video"
    params:
      width: 1344
      height: 768
      length: 73
      ref_image_size: "match"
  basic_guider:
    class_type: BasicGuider
    title: "Basic Guider"
  ksampler_select:
    class_type: KSamplerSelect
    title: "KSamplerSelect"
    params:
      sampler_name: "res_multistep"
  basic_scheduler:
    class_type: BasicScheduler
    title: "BasicScheduler"
    params:
      scheduler: "simple"
      steps: 20
      denoise: 1.0
  random_noise:
    class_type: RandomNoise
    title: "RandomNoise"
    params:
      noise_seed: 1
  sampler_custom_advanced:
    class_type: SamplerCustomAdvanced
    title: "SamplerCustomAdvanced"
  vae_decode:
    class_type: VAEDecode
    title: "VAE Decode"
  vae_decode_audio:
    class_type: VAEDecodeAudio
    title: "VAE Decode Audio"
  create_video:
    class_type: CreateVideo
    title: "Create Video"
    params:
      fps: 24
      bit_depth: 8
  save_video:
    class_type: SaveVideo
    title: "Save Video"
    params:
      filename_prefix: "video/MiniMax_H3"
      format: "auto"
      codec: "auto"

dynamic_lora_chains:
  loras:
    template: LoraLoader
    output_map:
      "unet_loader:0": model
      "clip_loader:0": clip
    input_map:
      model: model
      clip: clip
    template_output_map:
      "0": model
      "1": clip
    end_input_map:
      model:
        - "basic_guider:model"
        - "basic_scheduler:model"
      clip:
        - "minimax_h3:clip"

dynamic_h3_ref_img_chains:
  ref_images:
    target_node: "minimax_h3"

dynamic_h3_ref_video_chains:
  ref_videos:
    target_node: "minimax_h3"

dynamic_h3_ref_audio_chains:
  ref_audios:
    target_node: "minimax_h3"

connections:
  - from: "clip_loader:0"
    to: "minimax_h3:clip"
  - from: "video_vae_loader:0"
    to: "minimax_h3:vae"
  - from: "audio_vae_loader:0"
    to: "minimax_h3:audio_vae"
  - from: "unet_loader:0"
    to: "basic_guider:model"
  - from: "minimax_h3:0"
    to: "basic_guider:conditioning"
  - from: "unet_loader:0"
    to: "basic_scheduler:model"
  - from: "random_noise:0"
    to: "sampler_custom_advanced:noise"
  - from: "basic_guider:0"
    to: "sampler_custom_advanced:guider"
  - from: "ksampler_select:0"
    to: "sampler_custom_advanced:sampler"
  - from: "basic_scheduler:0"
    to: "sampler_custom_advanced:sigmas"
  - from: "minimax_h3:1"
    to: "sampler_custom_advanced:latent_image"
  - from: "sampler_custom_advanced:0"
    to: "vae_decode:samples"
  - from: "video_vae_loader:0"
    to: "vae_decode:vae"
  - from: "sampler_custom_advanced:0"
    to: "vae_decode_audio:samples"
  - from: "audio_vae_loader:0"
    to: "vae_decode_audio:vae"
  - from: "vae_decode:0"
    to: "create_video:images"
  - from: "vae_decode_audio:0"
    to: "create_video:audio"
  - from: "create_video:0"
    to: "save_video:video"

ui_map:
  prompt: "minimax_h3:prompt"
  width: "minimax_h3:width"
  height: "minimax_h3:height"
  length: "minimax_h3:length"
  seed: "random_noise:noise_seed"
  filename_prefix: "save_video:filename_prefix"
