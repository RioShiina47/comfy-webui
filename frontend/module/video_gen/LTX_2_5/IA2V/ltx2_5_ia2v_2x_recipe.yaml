nodes:
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      unet_name: "ltx-2.5-22b-distilled-transformer-nvfp4.safetensors"
      weight_dtype: "default"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      clip_name: "gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors"
      type: "ltxv"
      device: "default"
  video_vae_loader:
    class_type: VAELoader
    title: "Load Video VAE"
    params:
      vae_name: "ltx-2.5-video-vae-bf16.safetensors"
  audio_vae_loader:
    class_type: VAELoader
    title: "Load Audio VAE"
    params:
      vae_name: "ltx-2.5-audio-vae-bf16.safetensors"

  load_image:
    class_type: LoadImage
    title: "Load Start Image"
  resize_image:
    class_type: ResizeImageMaskNode
    title: "Resize Image/Mask"
    params:
      resize_type: "scale longer dimension"
      resize_type.longer_size: 1536
      scale_method: "lanczos"
  preprocess_image:
    class_type: LTXVPreprocess
    title: "LTXV Preprocess"
    params:
      img_compression: 18
  start_image_inplace_1:
    class_type: LTXVImgToVideoInplace
    title: "Apply Start Image to Latent 1"
    params:
      bypass: false
      strength: 0.7

  load_audio:
    class_type: LoadAudio
    title: "Load Audio"
  trim_audio:
    class_type: TrimAudioDuration
    title: "Trim Audio Duration"
    params:
      start_index: 0
  encode_audio:
    class_type: LTXVAudioVAEEncode
    title: "LTXV Audio VAE Encode"
  solid_mask:
    class_type: SolidMask
    title: "Create Solid Mask"
    params:
      value: 0
  mask_audio_latent:
    class_type: SetLatentNoiseMask
    title: "Set Latent Noise Mask"

  pos_prompt:
    class_type: CLIPTextEncode
    title: "Positive Prompt"
  neg_prompt:
    class_type: CLIPTextEncode
    title: "Negative Prompt"
  conditioning:
    class_type: LTXVConditioning
    title: "LTXV Conditioning"
    params:
      frame_rate: 24
  empty_video_latent:
    class_type: EmptyLTXVLatentVideo
    title: "Empty Video Latent"
    params:
      batch_size: 1
  latent_combiner_1:
    class_type: LTXVConcatAVLatent
    title: "Combine A/V Latents 1"

  sigmas_1:
    class_type: ManualSigmas
    title: "Sigmas 1"
    params:
      sigmas: "1.0, 0.99375, 0.9875, 0.98125, 0.975, 0.909375, 0.725, 0.421875, 0.0"
  noise_1:
    class_type: RandomNoise
    title: "Noise 1"
  guider_1:
    class_type: LTXVDualCFGGuider
    title: "LTXV Dual CFG Guider 1"
    params:
      video_cfg: 1.0
      audio_cfg: 1.0
  sampler_select_1:
    class_type: KSamplerSelect
    title: "Sampler Select 1"
    params:
      sampler_name: "euler_ancestral"
  sampler_1:
    class_type: SamplerCustomAdvanced
    title: "Sampler 1"
  latent_separator_1:
    class_type: LTXVSeparateAVLatent
    title: "Separate A/V Latents 1"

  start_image_inplace_2:
    class_type: LTXVImgToVideoInplace
    title: "Apply Start Image to Latent 2"
    params:
      bypass: false
      strength: 0.7
  latent_upscaler_loader:
    class_type: LatentUpscaleModelLoader
    title: "Load Latent Upscale Model"
    params:
      model_name: "{{ upscaler_model_name }}"
  latent_upscaler:
    class_type: LTXVLatentUpsampler
    title: "Latent Upsampler"
  latent_combiner_2:
    class_type: LTXVConcatAVLatent
    title: "Combine A/V Latents 2"

  sigmas_2:
    class_type: ManualSigmas
    title: "Sigmas 2"
    params:
      sigmas: "0.85, 0.7250, 0.4219, 0.0"
  noise_2:
    class_type: RandomNoise
    title: "Noise 2"
  guider_2:
    class_type: LTXVDualCFGGuider
    title: "LTXV Dual CFG Guider 2"
    params:
      video_cfg: 1.0
      audio_cfg: 1.0
  sampler_select_2:
    class_type: KSamplerSelect
    title: "Sampler Select 2"
    params:
      sampler_name: "euler_ancestral"
  sampler_2:
    class_type: SamplerCustomAdvanced
    title: "Sampler 2"
  latent_separator_2:
    class_type: LTXVSeparateAVLatent
    title: "Separate A/V Latents 2"

  video_decoder:
    class_type: VAEDecode
    title: "VAE Decode"
  audio_decoder:
    class_type: LTXVAudioVAEDecode
    title: "Audio VAE Decode"
  create_video:
    class_type: CreateVideo
    title: "Create Video"
    params:
      fps: 24
      bit_depth: 8
  save_video:
    class_type: SaveVideo
    title: "Save Video"
    params:
      filename_prefix: "video/LTX_2.5_ia2v"
      format: "auto"
      codec: "auto"

dynamic_lora_chains:
  loras:
    template: LoraLoader
    output_map:
      "unet_loader:0": model
      "clip_loader:0": clip
    input_map:
      model: model
      clip: clip
    template_output_map:
      "0": model
      "1": clip
    end_input_map:
      model:
        - "guider_1:model"
        - "guider_2:model"
      clip:
        - "pos_prompt:clip"
        - "neg_prompt:clip"

connections:
  - from: "unet_loader:0"
    to: "guider_1:model"
  - from: "unet_loader:0"
    to: "guider_2:model"
  - from: "clip_loader:0"
    to: "pos_prompt:clip"
  - from: "clip_loader:0"
    to: "neg_prompt:clip"
  - from: "video_vae_loader:0"
    to: "start_image_inplace_1:vae"
  - from: "video_vae_loader:0"
    to: "start_image_inplace_2:vae"
  - from: "video_vae_loader:0"
    to: "latent_upscaler:vae"
  - from: "video_vae_loader:0"
    to: "video_decoder:vae"
  - from: "audio_vae_loader:0"
    to: "encode_audio:audio_vae"
  - from: "audio_vae_loader:0"
    to: "audio_decoder:audio_vae"

  - from: "load_image:0"
    to: "resize_image:input"
  - from: "resize_image:0"
    to: "preprocess_image:image"
  - from: "preprocess_image:0"
    to: "start_image_inplace_1:image"
  - from: "preprocess_image:0"
    to: "start_image_inplace_2:image"

  - from: "load_audio:0"
    to: "trim_audio:audio"
  - from: "trim_audio:0"
    to: "encode_audio:audio"
  - from: "encode_audio:0"
    to: "mask_audio_latent:samples"
  - from: "solid_mask:0"
    to: "mask_audio_latent:mask"

  - from: "pos_prompt:0"
    to: "conditioning:positive"
  - from: "neg_prompt:0"
    to: "conditioning:negative"
  - from: "empty_video_latent:0"
    to: "start_image_inplace_1:latent"
  - from: "start_image_inplace_1:0"
    to: "latent_combiner_1:video_latent"
  - from: "mask_audio_latent:0"
    to: "latent_combiner_1:audio_latent"

  - from: "conditioning:0"
    to: "guider_1:positive"
  - from: "conditioning:1"
    to: "guider_1:negative"
  - from: "guider_1:0"
    to: "sampler_1:guider"
  - from: "noise_1:0"
    to: "sampler_1:noise"
  - from: "sigmas_1:0"
    to: "sampler_1:sigmas"
  - from: "sampler_select_1:0"
    to: "sampler_1:sampler"
  - from: "latent_combiner_1:0"
    to: "sampler_1:latent_image"
  - from: "sampler_1:0"
    to: "latent_separator_1:av_latent"

  - from: "latent_separator_1:0"
    to: "start_image_inplace_2:latent"
  - from: "start_image_inplace_2:0"
    to: "latent_upscaler:samples"
  - from: "latent_upscaler_loader:0"
    to: "latent_upscaler:upscale_model"
  - from: "latent_upscaler:0"
    to: "latent_combiner_2:video_latent"
  - from: "latent_separator_1:1"
    to: "latent_combiner_2:audio_latent"

  - from: "conditioning:0"
    to: "guider_2:positive"
  - from: "conditioning:1"
    to: "guider_2:negative"
  - from: "guider_2:0"
    to: "sampler_2:guider"
  - from: "noise_2:0"
    to: "sampler_2:noise"
  - from: "sigmas_2:0"
    to: "sampler_2:sigmas"
  - from: "sampler_select_2:0"
    to: "sampler_2:sampler"
  - from: "latent_combiner_2:0"
    to: "sampler_2:latent_image"
  - from: "sampler_2:0"
    to: "latent_separator_2:av_latent"

  - from: "latent_separator_2:0"
    to: "video_decoder:samples"
  - from: "latent_separator_2:1"
    to: "audio_decoder:samples"
  - from: "video_decoder:0"
    to: "create_video:images"
  - from: "audio_decoder:0"
    to: "create_video:audio"
  - from: "create_video:0"
    to: "save_video:video"

ui_map:
  start_image: "load_image:image"
  audio_file: "load_audio:audio"
  positive_prompt: "pos_prompt:text"
  negative_prompt: "neg_prompt:text"
  aspect_ratio:
    width: ["empty_video_latent:width", "solid_mask:width"]
    height: ["empty_video_latent:height", "solid_mask:height"]
  video_length:
    - "empty_video_latent:length"
  duration_in_seconds:
    - "trim_audio:duration"
  frame_rate:
    - "conditioning:frame_rate"
    - "create_video:fps"
  seed: ["noise_1:noise_seed", "noise_2:noise_seed"]
  filename_prefix: "save_video:filename_prefix"
