nodes:
  unet_loader:
    class_type: UNETLoader
    title: "Load Diffusion Model"
    params:
      unet_name: "ltx-2.5-22b-distilled-transformer-nvfp4.safetensors"
      weight_dtype: "default"
  clip_loader:
    class_type: CLIPLoader
    title: "Load CLIP"
    params:
      clip_name: "gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors"
      type: "ltxv"
      device: "default"
  video_vae_loader:
    class_type: VAELoader
    title: "Load Video VAE"
    params:
      vae_name: "ltx-2.5-video-vae-bf16.safetensors"
  audio_vae_loader:
    class_type: VAELoader
    title: "Load Audio VAE"
    params:
      vae_name: "ltx-2.5-audio-vae-bf16.safetensors"
  pos_prompt:
    class_type: CLIPTextEncode
    title: "Positive Prompt"
  neg_prompt:
    class_type: CLIPTextEncode
    title: "Negative Prompt"
  conditioning:
    class_type: LTXVConditioning
    title: "LTXV Conditioning"
    params:
      frame_rate: 24
  latent_video_gen:
    class_type: EmptyLTXVLatentVideo
    title: "Empty Video Latent"
    params:
      batch_size: 1
  start_image_loader:
    class_type: LoadImage
    title: "Load First Frame"
  resize_start_image:
    class_type: ResizeImageMaskNode
    title: "Resize Image/Mask"
    params:
      resize_type: "scale longer dimension"
      resize_type.longer_size: 1536
      scale_method: "lanczos"
  preprocess_start_image:
    class_type: LTXVPreprocess
    title: "LTXV Preprocess"
    params:
      img_compression: 18
  apply_start_image:
    class_type: LTXVImgToVideoInplace
    title: "LTXVImgToVideoInplace"
    params:
      bypass: false
      strength: 0.7
  latent_audio_gen:
    class_type: LTXVEmptyLatentAudio
    title: "Empty Audio Latent"
    params:
      batch_size: 1
      frame_rate: 24
  latent_combiner:
    class_type: LTXVConcatAVLatent
    title: "Combine A/V Latents"
  manual_sigmas:
    class_type: ManualSigmas
    title: "Manual Sigmas"
    params:
      sigmas: "1.0, 0.99375, 0.9875, 0.98125, 0.975, 0.909375, 0.725, 0.421875, 0.0"
  noise_gen:
    class_type: RandomNoise
    title: "Random Noise"
  guider:
    class_type: LTXVDualCFGGuider
    title: "LTXV Dual CFG Guider"
    params:
      video_cfg: 1.0
      audio_cfg: 1.0
  sampler_select:
    class_type: KSamplerSelect
    title: "Select Sampler"
    params:
      sampler_name: "euler_ancestral"
  sampler:
    class_type: SamplerCustomAdvanced
    title: "Sampler"
  latent_separator:
    class_type: LTXVSeparateAVLatent
    title: "Separate A/V Latents"
  video_decoder:
    class_type: VAEDecode
    title: "VAE Decode"
  audio_decoder:
    class_type: LTXVAudioVAEDecode
    title: "Audio VAE Decode"
  create_video:
    class_type: CreateVideo
    title: "Create Video"
    params:
      fps: 24
      bit_depth: 8
  save_video:
    class_type: SaveVideo
    title: "Save Video"
    params:
      filename_prefix: "video/LTX_2.5_i2v"
      format: "auto"
      codec: "auto"

dynamic_lora_chains:
  loras:
    template: LoraLoader
    output_map:
      "unet_loader:0": model
      "clip_loader:0": clip
    input_map:
      model: model
      clip: clip
    template_output_map:
      "0": model
      "1": clip
    end_input_map:
      model: "guider:model"
      clip:
        - "pos_prompt:clip"
        - "neg_prompt:clip"

connections:
  - from: "unet_loader:0"
    to: "guider:model"
  - from: "clip_loader:0"
    to: "pos_prompt:clip"
  - from: "clip_loader:0"
    to: "neg_prompt:clip"
  - from: "video_vae_loader:0"
    to: "video_decoder:vae"
  - from: "video_vae_loader:0"
    to: "apply_start_image:vae"
  - from: "audio_vae_loader:0"
    to: "latent_audio_gen:audio_vae"
  - from: "audio_vae_loader:0"
    to: "audio_decoder:audio_vae"
  - from: "pos_prompt:0"
    to: "conditioning:positive"
  - from: "neg_prompt:0"
    to: "conditioning:negative"

  - from: "start_image_loader:0"
    to: "resize_start_image:input"
  - from: "resize_start_image:0"
    to: "preprocess_start_image:image"
  - from: "preprocess_start_image:0"
    to: "apply_start_image:image"
  - from: "latent_video_gen:0"
    to: "apply_start_image:latent"

  - from: "apply_start_image:0"
    to: "latent_combiner:video_latent"
  - from: "latent_audio_gen:0"
    to: "latent_combiner:audio_latent"
  - from: "latent_combiner:0"
    to: "sampler:latent_image"

  - from: "conditioning:0"
    to: "guider:positive"
  - from: "conditioning:1"
    to: "guider:negative"
  - from: "guider:0"
    to: "sampler:guider"
  - from: "noise_gen:0"
    to: "sampler:noise"
  - from: "manual_sigmas:0"
    to: "sampler:sigmas"
  - from: "sampler_select:0"
    to: "sampler:sampler"
  - from: "sampler:0"
    to: "latent_separator:av_latent"
  - from: "latent_separator:0"
    to: "video_decoder:samples"
  - from: "latent_separator:1"
    to: "audio_decoder:samples"
  - from: "video_decoder:0"
    to: "create_video:images"
  - from: "audio_decoder:0"
    to: "create_video:audio"
  - from: "create_video:0"
    to: "save_video:video"

ui_map:
  start_image: "start_image_loader:image"
  positive_prompt: "pos_prompt:text"
  negative_prompt: "neg_prompt:text"
  aspect_ratio:
    width: "latent_video_gen:width"
    height: "latent_video_gen:height"
  video_length:
    - "latent_video_gen:length"
    - "latent_audio_gen:frames_number"
  frame_rate:
    - "conditioning:frame_rate"
    - "latent_audio_gen:frame_rate"
    - "create_video:fps"
  seed: "noise_gen:noise_seed"
  filename_prefix: "save_video:filename_prefix"
